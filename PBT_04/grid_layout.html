<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>E-Commerce Grid Layout</title>
    <link rel="stylesheet" href="grid.css" />
  </head>
  <body>
    <div class="container">
      <!-- HEADER -->
      <header class="header">
        <h1>MyShop</h1>
        <nav>
          <a href="#">Home</a>
          <a href="#">Products</a>
          <a href="#">About</a>
          <a href="#">Contact</a>
        </nav>
      </header>

      <!-- HERO -->
      <section class="hero">
        <div class="hero-card featured">
          <img src="https://picsum.photos/600/250?random=1" alt="" />
          <h2>Sản phẩm nổi bật</h2>
          <p>Giảm giá lên đến 50%</p>
        </div>

        <div class="hero-card">
          <img src="https://picsum.photos/300/250?random=2" alt="" />
          <h3>Ưu đãi hot</h3>
        </div>
      </section>

      <!-- SIDEBAR -->
      <aside class="sidebar">
        <h3>Bộ lọc</h3>

        <label>
          <input type="checkbox" />
          Điện tử
        </label>

        <label>
          <input type="checkbox" />
          Gaming
        </label>

        <label>
          <input type="checkbox" />
          Phụ kiện
        </label>

        <label>
          <input type="checkbox" />
          Giảm giá
        </label>
      </aside>

      <!-- MAIN CONTENT -->
      <main class="main-content">
        <div class="product-card">
          <img src="https://picsum.photos/250/180?random=11" />
          <h3>Tai nghe Bluetooth</h3>
          <p>499.000đ</p>
          <button>Mua</button>
        </div>

        <div class="product-card">
          <img src="https://picsum.photos/250/180?random=12" />
          <h3>Chuột Gaming</h3>
          <p>699.000đ</p>
          <button>Mua</button>
        </div>

        <div class="product-card">
          <img src="https://picsum.photos/250/180?random=13" />
          <h3>Bàn phím cơ</h3>
          <p>1.299.000đ</p>
          <button>Mua</button>
        </div>

        <div class="product-card">
          <img src="https://picsum.photos/250/180?random=14" />
          <h3>Webcam HD</h3>
          <p>899.000đ</p>
          <button>Mua</button>
        </div>

        <div class="product-card">
          <img src="https://picsum.photos/250/180?random=15" />
          <h3>Loa Bluetooth</h3>
          <p>799.000đ</p>
          <button>Mua</button>
        </div>

        <div class="product-card">
          <img src="https://picsum.photos/250/180?random=16" />
          <h3>Màn hình 24 inch</h3>
          <p>3.499.000đ</p>
          <button>Mua</button>
        </div>
      </main>

      <!-- ADS -->
      <aside class="ads">
        <h3>Quảng cáo</h3>
        <img src="https://picsum.photos/180/400?random=20" alt="" />
      </aside>

      <!-- FOOTER -->
      <footer class="footer">
        <p>© 2026 MyShop - All Rights Reserved</p>
      </footer>
    </div>
  </body>
</html>
