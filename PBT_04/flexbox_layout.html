<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flexbox Layout</title>
    <link rel="stylesheet" href="flexbox.css" />
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar">
      <!-- Logo -->
      <div class="logo">LOGO</div>

      <!-- Menu -->
      <ul class="menu">
        <li><a href="#">Home</a></li>
        <li><a href="#">Products</a></li>
        <li><a href="#">About</a></li>
      </ul>

      <!-- Auth buttons -->
      <div class="auth-buttons">
        <button class="login-btn">Login</button>
        <button class="register-btn">Register</button>
      </div>
    </nav>

    <!-- Product Cards -->
    <section class="products-container">
      <div class="card">
        <img src="https://via.placeholder.com/250x180" alt="product" />
        <h3>Tai nghe Bluetooth</h3>
        <p class="price">499.000đ</p>
        <button>Mua</button>
      </div>

      <div class="card">
        <img src="https://via.placeholder.com/250x180" alt="product" />
        <h3>Bàn phím cơ</h3>
        <p class="price">899.000đ</p>
        <button>Mua</button>
      </div>

      <div class="card">
        <img src="https://via.placeholder.com/250x180" alt="product" />
        <h3>Chuột Gaming</h3>
        <p class="price">350.000đ</p>
        <button>Mua</button>
      </div>

      <div class="card">
        <img src="https://via.placeholder.com/250x180" alt="product" />
        <h3>Màn hình 24 inch</h3>
        <p class="price">2.999.000đ</p>
        <button>Mua</button>
      </div>

      <div class="card">
        <img src="https://via.placeholder.com/250x180" alt="product" />
        <h3>Loa Bluetooth</h3>
        <p class="price">650.000đ</p>
        <button>Mua</button>
      </div>

      <div class="card">
        <img src="https://via.placeholder.com/250x180" alt="product" />
        <h3>Webcam HD</h3>
        <p class="price">750.000đ</p>
        <button>Mua</button>
      </div>

      <div class="card">
        <img src="https://via.placeholder.com/250x180" alt="product" />
        <h3>Ổ cứng SSD</h3>
        <p class="price">1.200.000đ</p>
        <button>Mua</button>
      </div>

      <div class="card">
        <img src="https://via.placeholder.com/250x180" alt="product" />
        <h3>Micro USB</h3>
        <p class="price">400.000đ</p>
        <button>Mua</button>
      </div>
    </section>
  </body>
</html>
