<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Multi API Dashboard</title>

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>📊 Multi API Dashboard</h1>

      <button id="refreshBtn">Refresh All</button>

      <p id="loadTime"></p>

      <!-- Loading tổng -->
      <div id="globalLoading">Đang tải dữ liệu...</div>

      <div class="dashboard">
        <!-- Widget Users -->
        <div class="card">
          <h2>👤 Users</h2>
          <div id="usersWidget">Loading...</div>
        </div>

        <!-- Widget Weather -->
        <div class="card">
          <h2>🌤 Weather</h2>
          <div id="weatherWidget">Loading...</div>
        </div>

        <!-- Widget Dog -->
        <div class="card">
          <h2>🐶 Random Dog</h2>
          <div id="dogWidget">Loading...</div>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
