<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Music Store - Multimedia</title>
  </head>
  <body>
    <h1>Music Store</h1>

    <!-- SVG LOGO -->
    <h2>Logo</h2>
    <svg width="120" height="120">
      <circle cx="60" cy="60" r="50" fill="purple"></circle>
      <text x="50%" y="50%" text-anchor="middle" fill="white" dy=".3em">
        MUSIC
      </text>
    </svg>

    <!-- ẢNH -->
    <h2>Album nổi bật</h2>

    <figure>
      <img
        src="https://placehold.co/300x300"
        alt="Album nhạc pop hiện đại"
        loading="lazy"
        style="max-width: 100%; height: auto"
      />
      <figcaption>Pop Vibes 2026 — Album nổi bật</figcaption>
    </figure>

    <figure>
      <img
        src="https://placehold.co/300x300"
        alt="Album nhạc chill lo-fi"
        loading="lazy"
        style="max-width: 100%; height: auto"
      />
      <figcaption>Lo-fi Chill — Thư giãn học tập</figcaption>
    </figure>

    <figure>
      <img
        src="https://placehold.co/300x300"
        alt="Album nhạc rock"
        loading="lazy"
        style="max-width: 100%; height: auto"
      />
      <figcaption>Rock Energy — Bùng nổ cảm xúc</figcaption>
    </figure>

    <!-- YOUTUBE -->
    <h2>MV nổi bật</h2>
    <iframe
      width="560"
      height="315"
      src="https://www.youtube.com/embed/kJQP7kiw5Fk"
      title="Music Video"
      frameborder="0"
      allowfullscreen
    >
    </iframe>

    <!-- VIDEO LOCAL -->
    <h2>Video hậu trường</h2>
    <video
      controls
      poster="https://placehold.co/600x300"
      style="max-width: 100%"
    >
      <source src="music.mp4" type="video/mp4" />
      <source src="music.webm" type="video/webm" />
      Trình duyệt không hỗ trợ video.
    </video>

    <!-- AUDIO -->
    <h2>Nghe thử</h2>
    <audio controls>
      <source src="sample-music.mp3" type="audio/mpeg" />
      Trình duyệt không hỗ trợ audio.
    </audio>
  </body>
</html>
