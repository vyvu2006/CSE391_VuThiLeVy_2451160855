<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Validation Test</title>
  </head>
  <body>
    <h2>Test validation HTML5</h2>

    <form>
      <p>Trường hợp 1:Text (required):</p>
      <input type="text" required value="" />

      <p>Trường hợp 2:Email:</p>
      <input type="email" value="abc" />

      <p>Trường hợp 3:Number (1-10):</p>
      <input type="number" min="1" max="10" value="15" />

      <p>Trường hợp 4:Text (10 digits):</p>
      <input type="text" pattern="[0-9]{10}" value="abc123" />

      <p>Trường hợp 5:Password (min 8 characters):</p>
      <input type="password" minlength="8" value="123" />

      <br /><br />
      <button type="submit">Submit</button>
    </form>
  </body>
</html>
