<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Animations</title>
    <link rel="stylesheet" href="animations.css" />
  </head>
  <body>
    <h1>Product Animation Demo</h1>

    <!-- Loading Spinner -->
    <div class="spinner"></div>

    <!-- Product Section -->
    <div class="product-container">
      <!-- Card 1 -->
      <div class="card fade-in">
        <div class="image-box">
          <img src="https://picsum.photos/300?1" alt="Product" />
        </div>

        <h3>Headphone</h3>
        <p>$35</p>

        <button>Mua ngay</button>
      </div>

      <!-- Card 2 -->
      <div class="card fade-in">
        <div class="image-box">
          <img src="https://picsum.photos/300?2" alt="Product" />
        </div>

        <h3>Smart Watch</h3>
        <p>$50</p>

        <button>Mua ngay</button>
      </div>

      <!-- Card 3 -->
      <div class="card fade-in">
        <div class="image-box">
          <img src="https://picsum.photos/300?3" alt="Product" />
        </div>

        <h3>Keyboard</h3>
        <p>$20</p>

        <button>Mua ngay</button>
      </div>
    </div>
  </body>
</html>
