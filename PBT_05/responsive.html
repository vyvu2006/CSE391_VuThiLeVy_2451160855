<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Responsive Product Page</title>
    <link rel="stylesheet" href="responsive.css" />
  </head>
  <body>
    <!-- Header -->
    <header class="header">
      <div class="logo">ShopX</div>

      <!-- Hamburger Mobile -->
      <div class="hamburger">☰</div>

      <!-- Menu Desktop/Tablet -->
      <nav class="nav-menu">
        <a href="#">Home</a>
        <a href="#">Products</a>
        <a href="#">Deals</a>
        <a href="#">Contact</a>
      </nav>
    </header>

    <!-- Main Layout -->
    <div class="container">
      <!-- Sidebar -->
      <aside class="sidebar">
        <h3>Filter</h3>
        <select>
          <option>All Products</option>
          <option>Clothing</option>
          <option>Electronics</option>
          <option>Shoes</option>
        </select>
      </aside>

      <!-- Product Grid -->
      <main class="product-grid">
        <div class="card">
          <img src="https://picsum.photos/300?1" alt="Product" />
          <h3>Product 1</h3>
          <p>$20</p>
          <button>Buy Now</button>
        </div>

        <div class="card">
          <img src="https://picsum.photos/300?2" alt="Product" />
          <h3>Product 2</h3>
          <p>$25</p>
          <button>Buy Now</button>
        </div>

        <div class="card">
          <img src="https://picsum.photos/300?3" alt="Product" />
          <h3>Product 3</h3>
          <p>$30</p>
          <button>Buy Now</button>
        </div>

        <div class="card">
          <img src="https://picsum.photos/300?4" alt="Product" />
          <h3>Product 4</h3>
          <p>$18</p>
          <button>Buy Now</button>
        </div>

        <div class="card">
          <img src="https://picsum.photos/300?5" alt="Product" />
          <h3>Product 5</h3>
          <p>$50</p>
          <button>Buy Now</button>
        </div>

        <div class="card">
          <img src="https://picsum.photos/300?6" alt="Product" />
          <h3>Product 6</h3>
          <p>$12</p>
          <button>Buy Now</button>
        </div>

        <div class="card">
          <img src="https://picsum.photos/300?7" alt="Product" />
          <h3>Product 7</h3>
          <p>$60</p>
          <button>Buy Now</button>
        </div>

        <div class="card">
          <img src="https://picsum.photos/300?8" alt="Product" />
          <h3>Product 8</h3>
          <p>$28</p>
          <button>Buy Now</button>
        </div>
      </main>

      <!-- Ads Bar -->
      <aside class="ads-bar">
        <h3>Advertisement</h3>
        <p>Special Discount!</p>
      </aside>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <p>© 2026 ShopX - All Rights Reserved</p>
    </footer>
  </body>
</html>
